name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ========================================
  # Job 1: Linting et Formatage
  # ========================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff mypy

      - name: Check code formatting with Black
        run: |
          black --check --diff .
        continue-on-error: true

      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github
        continue-on-error: true

      - name: Type check with mypy
        run: |
          mypy core/ agents/ cli/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

  # ========================================
  # Job 2: Tests Unitaires
  # ========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
          TEST_MODE: true
        run: |
          pytest tests/ \
            --cov=core \
            --cov=agents \
            --cov=cli \
            --cov-report=xml \
            --cov-report=term \
            --cov-fail-under=20 \
            -v
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.9'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ========================================
  # Job 3: Analyse de Sécurité
  # ========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit security scanner
        run: |
          bandit -r core/ agents/ cli/ -f json -o bandit-report.json
        continue-on-error: true

      - name: Check dependencies for vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --json
        continue-on-error: true

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ========================================
  # Job 4: Build & Validation
  # ========================================
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate project structure
        run: |
          # Vérifier que les fichiers critiques existent
          test -f core/ai_core.py
          test -f core/super_claude.py
          test -f agents/anthropic/bridge.py
          test -f cli/ai/main.py
          test -f setup.sh
          test -f .env.example
          echo "✓ Project structure validated"

      - name: Test CLI import
        run: |
          python -c "from cli.ai.main import AICli; print('✓ CLI import successful')"

      - name: Test core imports
        run: |
          python -c "from core.ai_core import AICore; print('✓ AICore import successful')"
          python -c "from core.super_claude import SuperClaude; print('✓ SuperClaude import successful')"

  # ========================================
  # Job 5: Documentation
  # ========================================
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README
        run: |
          test -f README.md
          test -s README.md
          echo "✓ README.md exists and is not empty"

      - name: Check documentation files
        run: |
          test -f docs/ARCHITECTURE.md
          test -f docs/PROTOCOL-A2A.md
          echo "✓ Documentation files present"

      - name: Validate Markdown
        uses: actionshub/markdownlint@main
        continue-on-error: true

  # ========================================
  # Job 6: Integration Summary
  # ========================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, docs]
    if: always()

    steps:
      - name: Check CI status
        run: |
          echo "==================================="
          echo "CI/CD Pipeline Summary"
          echo "==================================="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Docs: ${{ needs.docs.result }}"
          echo "==================================="

          # Fail if critical jobs failed
          if [ "${{ needs.test.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "❌ Critical jobs failed"
            exit 1
          fi

          echo "✅ CI/CD Pipeline completed"
